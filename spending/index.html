<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f5"><title>Everyday Spending · BillsOS</title><style>:root{--bg:#faf9f5;--card:#fff;--soft:#f7f5ef;--ink:#1f1e1d;--muted:#6b6a63;--line:#e3dfd3;--green:#2c6446;--accent:#c15f3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:#ebe5db}.brand{font-weight:900;font-size:18px;margin:4px 8px 18px}.nav{display:grid;gap:6px}.nav a{padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}.nav a.active{background:var(--green);color:#fff}.app{max-width:960px;width:100%;margin:auto;padding:22px 16px 48px}h1{font-size:34px;letter-spacing:-.04em;margin:4px 0}.muted{color:var(--muted);font-size:12px;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0 12px}.metric,.runway,.cat{background:var(--card);border:1px solid var(--line);border-radius:20px}.metric{padding:15px}.metric small{display:block;text-transform:uppercase;letter-spacing:.07em;color:#1f5b48;font-size:9px;font-weight:800;margin-top:7px}.metric b{display:block;font-size:23px;margin-top:5px}.metric span,.r span{font-size:9px;color:var(--muted)}.runway{padding:14px}.runway h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.r{text-align:center;padding:8px;border-right:1px solid var(--line)}.r:last-child{border:0}.r b{display:block;font-size:19px;margin-top:3px}.prog{height:5px;background:#e3e2df;border-radius:10px;margin:7px auto 0;max-width:90px}.prog i{display:block;height:100%;background:var(--accent);border-radius:10px}.reconcile{margin-top:10px;color:var(--muted);font-size:10px;line-height:1.5}.section{margin:28px 2px 10px;font-size:22px}details{overflow:hidden}summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}.cat{margin:9px 0}.cat>summary{display:grid;grid-template-columns:40px minmax(0,1fr) auto 22px;gap:12px;align-items:center;padding:14px 16px}.ico{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#f3eee5}.name{font-weight:600;font-size:15px;min-width:0}.name small{display:block;color:var(--muted);font-size:11px;margin-top:3px;font-weight:500}.cat>summary>b{font-size:18px;white-space:nowrap}.subs{border-top:1px solid var(--line);padding:9px 12px}.sub{background:var(--soft);border:1px solid var(--line);border-radius:15px;margin:8px 0}.sub>summary,.vendor>summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 12px}.right{display:flex;align-items:center;gap:8px}.vendors{border-top:1px solid var(--line);padding:8px}.vendor{background:var(--card);border:1px solid var(--line);border-radius:13px;margin:7px 0}.row{display:grid;grid-template-columns:72px minmax(0,1fr) auto max-content;gap:8px;padding:9px 10px;border-top:1px solid #ece6de;font-size:10px;align-items:center}.pending{color:#9b6b13}.amt{font-weight:800;text-align:right;white-space:nowrap}.foot{text-align:center;color:var(--muted);font-size:10px;margin-top:18px}@media(max-width:760px){.shell{grid-template-columns:72px 1fr}.side{padding:14px 6px}.brand{font-size:12px;text-align:center;margin:6px 0 14px}.nav a{font-size:10px;text-align:center;padding:9px 4px}.cards{grid-template-columns:1fr 1fr}.rgrid{grid-template-columns:1fr 1fr}.r{border-right:0;border-bottom:1px solid var(--line)}.r:nth-child(odd){border-right:1px solid var(--line)}.r:last-child{grid-column:1/-1;border:0}h1{font-size:28px}.row{grid-template-columns:54px minmax(0,1fr) max-content}.row .status{display:none}}</style></head><body><div class="shell"><aside class="side"><div class="brand">BillsOS</div><nav class="nav"><a href="/">Home</a><a href="/calendar/">Calendar</a><a class="active" href="/spending/">Everyday Spending</a><a href="/generated-v5.html">Bills</a><a href="/income/">Income</a><a href="/backup/">Backup</a></nav></aside><main class="app"><h1>Spending since transfer</h1><div class="muted" id="fresh">Loading banking data…</div><section class="cards" id="cards"></section><section class="runway" id="runway"></section><h2 class="section">Where it went</h2><div id="cats"></div><div class="foot">Category → Subcategory → Vendor subtotal → Transactions</div></main></div><script>const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),fmt=d=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(d)),dateOnly=d=>new Intl.DateTimeFormat('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'}).format(new Date(d+'T12:00:00Z')),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const total=a=>a.reduce((s,x)=>s+Number(x.a||0),0),group=(a,k)=>a.reduce((o,x)=>((o[x[k]]??=[]).push(x),o),{});function metric(i,l,v,n){return `<div class="metric"><div>${i}</div><small>${l}</small><b>${v}</b><span>${n}</span></div>`}function vendor(n,r){return `<details class="vendor"><summary><div class="name">${esc(n)}<small>${r.length} item${r.length===1?'':'s'}</small></div><div class="right"><b>${money(total(r))}</b><span>⌄</span></div></summary>${[...r].sort((a,b)=>Number(b.a)-Number(a.a)).map(x=>`<div class="row"><span>${x.date.slice(5)}</span><strong>${esc(x.m)}</strong><span class="status ${x.p?'pending':''}">${x.p?'Pending':'Posted'}</span><span class="amt">${money(x.a)}</span></div>`).join('')}</details>`}function sub(n,r){const vs=group(r,'m');return `<details class="sub"><summary><div class="name">${esc(n)}<small>${r.length} transaction${r.length===1?'':'s'}</small></div><div class="right"><b>${money(total(r))}</b><span>⌄</span></div></summary><div class="vendors">${Object.entries(vs).sort((a,b)=>total(b[1])-total(a[1])).map(([v,rows])=>vendor(v,rows)).join('')}</div></details>`}const meta={'Groceries':'🛒','Dining':'🍴','Household / Shopping':'🛍️','Kids':'🧒','Gas / Transportation':'⛽','Personal Care':'💅','Pets':'🐾','Entertainment':'🎬','Financial / Fees':'🏦','Services':'🧰','Gifts':'🎁','Other':'•'};function cat(n,r){const ss=group(r,'s');return `<details class="cat"><summary><div class="ico">${meta[n]||'•'}</div><div class="name">${esc(n)}<small>${r.length} transaction${r.length===1?'':'s'}</small></div><b>${money(total(r))}</b><span>⌄</span></summary><div class="subs">${Object.entries(ss).sort((a,b)=>total(b[1])-total(a[1])).map(([s,rows])=>sub(s,rows)).join('')}</div></details>`}fetch('/spending/current.json?v=20260912-105137',{cache:'no-store'}).then(r=>r.json()).then(d=>{const m=d.metrics,c=d.cycle;$('#fresh').innerHTML=`${dateOnly(c.start)} – ${dateOnly(c.end)} · Next transfer: ${dateOnly(c.nextTransfer)}<br>Bank balance as of ${fmt(d.freshness.balanceAsOf)} · ${d.freshness.transactionFreshness==='unknown'?'Transaction banking freshness unknown (coverage complete for this query).':'Transactions freshness available'}`;$('#cards').innerHTML=metric('💸','Transferred In',money(m.transferredIn),'cycle funding transfers')+metric('🧾','Total Spent',money(m.totalSpent),'posted + pending')+metric('🏦','Remaining',money(m.remainingAvailable),'available balance')+metric('🔄','Next Transfer',c.daysLeft+' days',dateOnly(c.nextTransfer));$('#runway').innerHTML=`<h2>Runway</h2><div class="rgrid"><div class="r"><b>${c.daysLeft}</b><span>days left</span></div><div class="r"><b>${money(m.availablePerDay)}</b><span>available per day</span></div><div class="r"><b>${money(m.pendingSpend)}</b><span>pending spend</span></div><div class="r"><b>${money(m.postedSpend)}</b><span>posted spend</span></div><div class="r"><b>${m.percentCycleFundsUsed.toFixed(1)}%</b><span>cycle funds used</span><div class="prog"><i style="width:${Math.min(100,m.percentCycleFundsUsed)}%"></i></div></div></div><div class="reconcile">${esc(d.reconciliation)}</div>`;const cs=group(d.transactions,'c');$('#cats').innerHTML=Object.entries(cs).sort((a,b)=>total(b[1])-total(a[1])).map(([n,r])=>cat(n,r)).join('')}).catch(()=>{$('#fresh').textContent='Unable to load current spending data.'});</script></body></html>
