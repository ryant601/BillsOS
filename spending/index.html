<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1ede6"><title>Everyday Spending · BillsOS</title><style>:root{--bg:#f1ede6;--p:#fffdf9;--p2:#f8f4ed;--i:#17372f;--m:#77736d;--l:#ddd5c9;--g:#0f513e;--pu:#6b4fa0;--warn:#9b6b13}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:960px;margin:auto;padding:18px 14px 48px}.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}.mark{width:38px;height:38px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900}.brand small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--m);font-weight:800}h1{font-size:33px;letter-spacing:-.04em;margin:6px 0}.muted{color:var(--m);font-size:12px;line-height:1.45}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 12px}.metric,.runway,.cat{background:var(--p);border:1px solid var(--l);border-radius:20px}.metric{padding:15px}.emoji{font-size:20px}.metric small{display:block;text-transform:uppercase;letter-spacing:.07em;color:#1f5b48;font-size:9px;font-weight:800;margin-top:8px}.metric b{display:block;font-size:23px;margin-top:5px}.metric span,.r span{font-size:9px;color:var(--m)}.runway{padding:14px}.runway h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}.rgrid{display:grid;grid-template-columns:repeat(5,1fr)}.r{text-align:center;padding:7px 10px;border-right:1px solid var(--l)}.r:last-child{border:0}.r b{display:block;font-size:19px;margin-top:4px}.prog{height:5px;background:#e3e2df;border-radius:10px;margin:7px auto 0;max-width:90px}.prog i{display:block;height:100%;background:var(--pu);border-radius:10px}.reconcile{margin-top:10px;color:var(--m);font-size:10px;line-height:1.45}.section{margin:28px 2px 10px;font-size:22px}details{overflow:hidden}summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}.cat{margin:9px 0}.cat>summary{display:grid;grid-template-columns:42px 1fr auto 18px;gap:10px;align-items:center;padding:14px}.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:19px}.name{font-weight:850;font-size:14px}.name small,.sub small,.vendor small{display:block;color:var(--m);font-size:9px;margin-top:2px;font-weight:500}.cat>summary>b{font-size:20px}.chev{color:var(--m)}.subs{border-top:1px solid var(--l);padding:9px 12px}.sub{background:var(--p2);border:1px solid var(--l);border-radius:15px;margin:8px 0}.sub>summary,.vendor>summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 12px}.right{display:flex;align-items:center;gap:8px}.vendors{border-top:1px solid var(--l);padding:8px}.vendor{background:var(--p);border:1px solid var(--l);border-radius:13px;margin:7px 0}.tx{border-top:1px solid var(--l);background:var(--p)}.row{display:grid;grid-template-columns:64px 1fr 70px auto;gap:8px;padding:9px 10px;border-top:1px solid #ece6de;font-size:10px;align-items:center}.row:first-child{border-top:0}.status{color:#59645e}.pending{color:var(--warn)}.refund{color:#0f6a50}.amt{font-weight:800;text-align:right}.note{color:var(--m);font-size:9px;margin-top:2px}.foot{text-align:center;color:var(--m);font-size:10px;margin-top:18px}.error{padding:18px;border:1px solid #d7bdb6;background:#fff8f5;border-radius:16px;color:#8c3d2c}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.rgrid{grid-template-columns:1fr 1fr}.r{border-right:0;border-bottom:1px solid var(--l)}.r:nth-child(odd){border-right:1px solid var(--l)}.r:last-child{grid-column:1/-1;border:0}h1{font-size:29px}.row{grid-template-columns:58px 1fr auto}.row .status{display:none}.cat>summary{grid-template-columns:38px 1fr auto 14px;padding:12px}.cat>summary>b{font-size:17px}.sub>summary,.vendor>summary{padding:12px}.subs{padding:7px}}</style></head><body><main class="app"><header class="brand"><div class="mark">$</div><div><small>BillsOS</small><strong>Everyday Spending</strong></div></header><h1>Spending since transfer</h1><div class="muted" id="fresh">Loading banking data…</div><section class="cards" id="cards"></section><section class="runway" id="runway"></section><h2 class="section">Where it went</h2><div id="cats"></div><div class="foot">Category → Subcategory → Vendor subtotal → Transactions</div></main><script>const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),fmt=d=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(d)),dateOnly=d=>new Intl.DateTimeFormat('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'}).format(new Date(d+'T12:00:00Z')),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const icons={'Groceries':'🛒','Dining':'🍽️','Gas / Transportation':'⛽','Kids':'🧒','Household / Shopping':'🛍️','Personal Care':'✨','Entertainment':'🎬','Services':'🧰','Financial / Fees':'🏦','Other':'•'},accents=['#447a5b','#925c46','#657c9b','#98733d','#6f6794','#7f6b77','#6c7a55','#667c76','#7e7066','#777'];function total(a){return a.reduce((s,x)=>s+Number(x.a||0),0)}function group(a,k){return a.reduce((o,x)=>((o[x[k]]??=[]).push(x),o),{})}function metric(icon,label,val,note){return `<div class="metric"><div class="emoji">${icon}</div><small>${label}</small><b>${val}</b><span>${note}</span></div>`}function renderCat(name,rows,i){const subs=group(rows,'s'),ct=total(rows);return `<details class="cat"><summary><div class="ico" style="--accent:${accents[i%accents.length]};background:var(--accent)">${icons[name]||'•'}</div><div class="name">${esc(name)}<small>${rows.length} transaction${rows.length===1?'':'s'}</small></div><b>${money(ct)}</b><span class="chev">⌄</span></summary><div class="subs">${Object.entries(subs).map(([sn,sr])=>renderSub(sn,sr)).join('')}</div></details>`}function renderSub(name,rows){const vs=group(rows,'m');return `<details class="sub"><summary><div class="name">${esc(name)}<small>${rows.length} transaction${rows.length===1?'':'s'}</small></div><div class="right"><b>${money(total(rows))}</b><span>⌄</span></div></summary><div class="vendors">${Object.entries(vs).map(([vn,vr])=>renderVendor(vn,vr)).join('')}</div></details>`}function renderVendor(name,rows){return `<details class="vendor"><summary><div class="name">${esc(name)}<small>${rows.length} item${rows.length===1?'':'s'}</small></div><div class="right"><b>${money(total(rows))}</b><span>⌄</span></div></summary><div class="tx">${rows.map(r=>`<div class="row"><span>${r.date.slice(5)}</span><div><strong>${esc(r.m)}</strong>${r.n?`<div class="note">${esc(r.n)}</div>`:''}</div><span class="status ${r.p?'pending':''}">${r.p?'Pending':'Posted'}</span><span class="amt ${r.a<0?'refund':''}">${r.a<0?'−':''}${money(Math.abs(r.a))}</span></div>`).join('')}</div></details>`}fetch('/spending/current.json?v=20260902-1630',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const m=d.metrics,c=d.cycle,f=d.freshness;$('#fresh').innerHTML=`${dateOnly(c.start)} – ${dateOnly(c.end)} · Next transfer: ${dateOnly(c.nextTransfer)}<br>Bank balance as of ${fmt(f.balanceAsOf)} · ${f.transactionFreshness==='unknown'?'Transaction banking freshness unknown (coverage complete for this query).':'Transactions as of '+fmt(f.transactionAsOf)}`;$('#cards').innerHTML=metric('💸','Transferred In',money(m.transferredIn),'cycle funding transfers')+metric('🧾','Total Spent',money(m.totalSpent),'posted + pending')+metric('🏦','Remaining',money(m.remainingAvailable),'current available balance')+metric('🔄','Next Transfer',`${c.daysLeft} days`,dateOnly(c.nextTransfer));$('#runway').innerHTML=`<h2>Runway</h2><div class="rgrid"><div class="r"><div class="emoji">📅</div><b>${c.daysLeft}</b><span>days left</span></div><div class="r"><div class="emoji">🕒</div><b>${money(m.availablePerDay)}</b><span>available per day</span></div><div class="r"><div class="emoji">⏳</div><b>${money(m.pendingSpend)}</b><span>pending spend</span></div><div class="r"><div class="emoji">📋</div><b>${money(m.postedSpend)}</b><span>posted spend</span></div><div class="r"><div class="emoji">🥧</div><b>${m.percentCycleFundsUsed.toFixed(1)}%</b><span>cycle funds used</span><div class="prog"><i style="width:${Math.min(100,m.percentCycleFundsUsed)}%"></i></div></div></div><div class="reconcile">${esc(d.reconciliation)}</div>`;const cats=group(d.transactions,'c');$('#cats').innerHTML=Object.entries(cats).sort((a,b)=>total(b[1])-total(a[1])).map(([n,r],i)=>renderCat(n,r,i)).join('')}).catch(()=>{$('#fresh').innerHTML='<div class="error">Unable to load current spending data.</div>'})</script></body></html>
