<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f5"><title>Everyday Spending · BillsOS</title><style>:root{--bg:#faf9f5;--card:#fff;--soft:#f7f5ef;--ink:#1f1e1d;--muted:#6b6a63;--line:#e3dfd3;--green:#2c6446}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:#ebe5db}.brand{font-weight:900;font-size:18px;margin:4px 8px 18px}.nav{display:grid;gap:6px}.nav a{padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}.nav a.active{background:var(--green);color:#fff}.app{max-width:960px;width:100%;margin:auto;padding:22px 16px 48px}h1{font-size:34px;margin:4px 0}.muted{color:var(--muted);font-size:12px;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.metric,.runway,.cat{background:var(--card);border:1px solid var(--line);border-radius:20px}.metric{padding:15px}.metric small{display:block;color:#1f5b48;font-size:9px;font-weight:800;text-transform:uppercase}.metric b{display:block;font-size:23px;margin-top:5px}.runway{padding:14px;margin-bottom:24px}.rgrid{display:grid;grid-template-columns:repeat(5,1fr)}.r{text-align:center;padding:8px}.r b{display:block;font-size:19px}.cat{margin:9px 0}.cat>summary,.sub>summary,.vendor>summary{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;cursor:pointer}.subs,.vendors{padding:8px;border-top:1px solid var(--line)}.sub,.vendor{background:var(--soft);border:1px solid var(--line);border-radius:14px;margin:7px 0}.vendor{background:#fff}.row{display:grid;grid-template-columns:72px 1fr auto auto;gap:8px;padding:9px 10px;border-top:1px solid #ece6de;font-size:10px}.pending{color:#9b6b13}.amt{font-weight:800}.foot{text-align:center;color:var(--muted);font-size:10px;margin-top:18px}@media(max-width:760px){.shell{grid-template-columns:72px 1fr}.side{padding:14px 6px}.brand{font-size:12px;text-align:center}.nav a{font-size:10px;text-align:center;padding:9px 4px}.cards{grid-template-columns:1fr 1fr}.rgrid{grid-template-columns:1fr 1fr}.row{grid-template-columns:54px 1fr auto}.status{display:none}h1{font-size:28px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">BillsOS</div><nav class="nav"><a href="/">Home</a><a href="/calendar/">Calendar</a><a class="active" href="/spending/">Everyday Spending</a><a href="/generated-v5.html">Bills</a><a href="/income/">Income</a><a href="/backup/">Backup</a></nav></aside><main class="app"><h1>Spending since transfer</h1><div class="muted" id="fresh">Loading banking data…</div><section class="cards" id="cards"></section><section class="runway" id="runway"></section><h2>Where it went</h2><div id="cats"></div><div class="foot">Category → Subcategory → Vendor subtotal → Transactions</div></main></div><script>const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),fmt=d=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(d)),total=a=>a.reduce((s,x)=>s+Number(x.a||0),0),group=(a,k)=>a.reduce((o,x)=>((o[x[k]]??=[]).push(x),o),{}),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function metric(l,v,n){return `<div class="metric"><small>${l}</small><b>${v}</b><span>${n}</span></div>`}function vendor(n,r){return `<details class="vendor"><summary><strong>${esc(n)}</strong><b>${money(total(r))}</b></summary>${[...r].sort((a,b)=>Number(b.a)-Number(a.a)).map(x=>`<div class="row"><span>${x.date.slice(5)}</span><strong>${esc(x.m)}</strong><span class="status ${x.p?'pending':''}">${x.p?'Pending':'Posted'}</span><span class="amt">${money(x.a)}</span></div>`).join('')}</details>`}function sub(n,r){const vs=group(r,'m');return `<details class="sub"><summary><strong>${esc(n)}</strong><b>${money(total(r))}</b></summary><div class="vendors">${Object.entries(vs).sort((a,b)=>total(b[1])-total(a[1])).map(([v,rows])=>vendor(v,rows)).join('')}</div></details>`}function cat(n,r){const ss=group(r,'s');return `<details class="cat"><summary><strong>${esc(n)}</strong><b>${money(total(r))}</b></summary><div class="subs">${Object.entries(ss).sort((a,b)=>total(b[1])-total(a[1])).map(([s,rows])=>sub(s,rows)).join('')}</div></details>`}fetch('/spending/current.json?v=20260917-1145',{cache:'no-store'}).then(r=>r.json()).then(d=>{const m=d.metrics,c=d.cycle;$('#fresh').innerHTML=`${c.start} – ${c.end} · Next transfer: ${c.nextTransfer}<br>Bank balance as of ${fmt(d.freshness.balanceAsOf)} · Transaction banking freshness ${d.freshness.transactionFreshness}${d.freshness.transactionFreshness==='unknown'?' (coverage complete for this query)':''}.`;$('#cards').innerHTML=metric('Transferred In',money(m.transferredIn),'cycle funding')+metric('Total Spent',money(m.totalSpent),'posted + pending')+metric('Remaining',money(m.remainingAvailable),'available balance')+metric('Next Transfer',c.daysLeft+' days',c.nextTransfer);$('#runway').innerHTML=`<h3>Runway</h3><div class="rgrid"><div class="r"><b>${c.daysLeft}</b><span>days left</span></div><div class="r"><b>${money(m.availablePerDay)}</b><span>available/day</span></div><div class="r"><b>${money(m.pendingSpend)}</b><span>pending</span></div><div class="r"><b>${money(m.postedSpend)}</b><span>posted</span></div><div class="r"><b>${m.percentCycleFundsUsed.toFixed(1)}%</b><span>funds used</span></div></div><div class="muted">${esc(d.reconciliation)}</div>`;const cs=group(d.transactions,'c');$('#cats').innerHTML=Object.entries(cs).sort((a,b)=>total(b[1])-total(a[1])).map(([n,r])=>cat(n,r)).join('')}).catch(()=>{$('#fresh').textContent='Unable to load current spending data.'});</script></body></html>
