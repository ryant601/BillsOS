<script>
(function(){'use strict';

function money(v){return Number(v||0).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2})}
function signed(v){return (v>=0?'+':'−')+Number(Math.abs(v)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function days(month,year){return new Date(year,month,0).getDate()}
function iso(month,day,year){return year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0')}
function validIso(v){return /^20\d{2}-\d{2}-\d{2}$/.test(String(v||''))}
function todayIso(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function readMap(k){try{var parsed=JSON.parse(localStorage.getItem(k)||'{}');return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{}}catch(e){return {}}}
function rowKey(r){return (r.iso||r.date)+'|'+r.name+'|'+r.amount}
function readYearState(){try{var value=JSON.parse(localStorage.getItem(YEAR_NAV_KEY)||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}catch(e){return {}}}

function monthKey(m){return Number(m[3])*100+Number(m[2])}
function currentMonthKey(){var d=new Date();return d.getFullYear()*100+d.getMonth()+1}
function isPastMonth(m){return monthKey(m)<currentMonthKey()}
function readPastMonths(){try{return localStorage.getItem(PAST_MONTHS_KEY)==='1'}catch(e){return false}}

function setYearExpanded(year,expanded,persist){var button=document.getElementById('year-pill-'+year),list=document.getElementById('year-months-'+year);if(!button||!list)return;button.setAttribute('aria-expanded',expanded?'true':'false');list.hidden=!expanded;if(persist!==false){var state=readYearState();state[year]=!!expanded;writeYearState(state)}}
function yearTabsHtml(activeId){var state=readYearState(),activeYear=activeYearFor(activeId),showPast=readPastMonths(),pastCount=months.filter(isPastMonth).length,years=[2026,2027],groups=years.map(function(year){var yearMonths=months.filter(function(m){return m[3]===year}),expanded=year===activeYear||(state[year]===true&&year!==activeYear),monthButtons=yearMonths.map(function(m){var id=shortIds[m[0]],past=isPastMonth(m);return '<button id="btn-'+id+'" type="button" data-year="'+year+'" data-past="'+(past?'true':'false')+'"'+(past&&!showPast?' hidden aria-hidden="true"':'')+'>'+m[1]+'</button>'}).join('');return '<section class="year-group" data-year="'+year+'"><button class="year-pill" id="year-pill-'+year+'" type="button" aria-expanded="'+(expanded?'true':'false')+'" aria-controls="year-months-'+year+'"><span>'+year+'</span><span class="year-chevron" aria-hidden="true">⌄</span></button><div class="year-months" id="year-months-'+year+'"'+(expanded?'':' hidden')+'>'+monthButtons+'</div></section>'}).join('');return groups+(pastCount?'<button class="past-months-toggle" id="past-months-toggle" type="button" aria-pressed="'+(showPast?'true':'false')+'">'+(showPast?'Hide past months':'Show past months ('+pastCount+')')+'</button>':'')}
function bindYearTabs(){[2026,2027].forEach(function(year){var pill=document.getElementById('year-pill-'+year);if(pill)pill.onclick=function(){setYearExpanded(year,this.getAttribute('aria-expanded')!=='true',true)}})}

function bindPastMonthsToggle(){var toggle=document.getElementById('past-months-toggle');if(toggle)toggle.onclick=function(){writePastMonths(!readPastMonths());applyPastMonthVisibility()}}
function bindMonthTabs(){months.forEach(function(m){var id=shortIds[m[0]],btn=document.getElementById('btn-'+id);if(btn)btn.onclick=function(){showMonth(id)}})}
function keyIdentity(key){var p=String(key||'').split('|');if(p.length<3)return '';var amount=Number(p[p.length-1]);return p.slice(1,-1).join('|')+'|'+(isFinite(amount)?amount:p[p.length-1])}
function occurrenceMonth(key,edit){var original=edit&&edit.originalDate?String(edit.originalDate):'',month=String(original||key||'').slice(0,7);return /^\d{4}-\d{2}$/.test(month)?month:''}
function matchingOverride(map,key){if(map&&map[key])return map[key];var id=keyIdentity(key),month=occurrenceMonth(key);if(!id||!month)return null;var matches=Object.keys(map||{}).filter(function(c){return keyIdentity(c)===id&&occurrenceMonth(c,map[c])===month});if(!matches.length)return null;matches.sort(function(a,b){return (Date.parse((map[b]&&map[b].updatedAt)||'')||0)-(Date.parse((map[a]&&map[a].updatedAt)||'')||0)});return map[matches[0]]||null}
function applyCardEdits(rows,targetMonth,targetYear){var amountMap=readMap(AMOUNT_KEY),dateMap=readMap(DATE_KEY),mv=targetYear+'-'+String(targetMonth).padStart(2,'0');return rows.map(function(row){var key=rowKey(row),out=Object.assign({},row),amountEdit=matchingOverride(amountMap,key),dateEdit=matchingOverride(dateMap,key),sign=Number(out.amount||0)<0?-1:1;if(amountEdit&&isFinite(Number(amountEdit.amount)))out.amount=sign*Math.abs(Number(amountEdit.amount));if(dateEdit&&validIso(dateEdit.date)){out.iso=dateEdit.date;out.date=dateEdit.date;out.day=Number(dateEdit.date.slice(8,10));out.moved=true}out.originalKey=key;return out}).filter(function(row){return String(row.iso||row.date||'').slice(0,7)===mv}).sort(function(a,b){return String(a.iso||a.date).localeCompare(String(b.iso||b.date))||Number(b.amount||0)-Number(a.amount||0)})}
function allModelRows(model){var out=[];months.forEach(function(m){var key=m[0],rows=model&&model.months&&model.months[key]&&model.months[key].rows||[];rows.forEach(function(r){out.push(r)})});return out}

async function loadBillsData(){var data={bills:[],income:[],oneTimeEvents:[]};try{var r=await fetch('/api/bills?dashboard='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(r.ok)data=await r.json()}catch(e){}data.bills=Array.isArray(data.bills)?data.bills.filter(function(x){return x&&x.active!==false}):[];data.income=Array.isArray(data.income)?data.income.filter(function(x){return x&&x.active!==false&&Number(x.amount||0)}):[];data.oneTimeEvents=Array.isArray(data.oneTimeEvents)?data.oneTimeEvents.filter(function(x){return x&&!/^__billsos_/.test(String(x.id||''))&&Number(x.amount||0)}):[];return data}
function shortDate(date){return new Date(date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}

function eventHtml(r){var cls=window.BillsOSCashflow.calendarClass(r),cardKey=r.originalKey||rowKey(r);return '<div class="ev '+cls+'" data-id="'+esc(cardKey)+'"><span class="dot"></span><span class="nm">'+esc(r.name)+'</span><span class="amt">'+signed(r.amount)+'</span></div>'}

function weekHtml(week){var riskClass=week.negativeDays?' has-negative':week.lowDays?' has-low':'',risk=week.negativeDays?'<span class="risk-negative">'+week.negativeDays+' negative day'+(week.negativeDays===1?'':'s')+'</span>':week.lowDays?'<span class="risk-low">'+week.lowDays+' low day'+(week.lowDays===1?'':'s')+'</span>':'<span>On track</span>',body=week.days.map(dayHtml).join('');return '<section class="calendar-week'+riskClass+'" id="'+week.id+'" data-default-expanded="'+(week.defaultExpanded?'true':'false')+'"><button class="calendar-week-toggle" type="button" aria-expanded="false" aria-controls="'+week.id+'-body"><span class="calendar-week-title"><strong>'+shortDate(week.startDate)+'–'+shortDate(week.endDate)+'</strong><small>'+week.transactionCount+' transaction'+(week.transactionCount===1?'':'s')+'</small></span><span class="calendar-week-summary">'+risk+'<span>Lowest '+money(week.lowestBalance)+' on '+shortDate(week.lowestDate)+'</span><span class="calendar-week-action">Show week</span></span></button><div class="calendar-week-body" id="'+week.id+'-body" hidden>'+body+'</div></section>'}
function riskHtml(summary){if(summary.negativeDays){return '<div class="month-risk is-negative"><div><strong>'+summary.negativeDays+' negative projected day'+(summary.negativeDays===1?'':'s')+'</strong><span>Lowest '+money(summary.lowestBalance)+' on '+longDate(summary.lowestDate)+'</span></div><button class="month-risk-jump" type="button" data-week-target="'+summary.firstNegativeWeekId+'">Review first risk</button></div>'}if(summary.lowDays){return '<div class="month-risk is-low"><div><strong>'+summary.lowDays+' low-balance day'+(summary.lowDays===1?'':'s')+'</strong><span>No negative days · Lowest '+money(summary.lowestBalance)+' on '+longDate(summary.lowestDate)+'</span></div></div>'}return '<div class="month-risk"><div><strong>No negative projected days</strong><span>Lowest '+money(summary.lowestBalance)+' on '+longDate(summary.lowestDate)+'</span></div></div>'}
function recommendationsHtml(rows,summary){if(!summary.days.some(function(day){return day.date>=todayIso()&&day.isNegative})||!window.BillsOSNegativeBalanceRecommendations)return '';var choices=window.BillsOSNegativeBalanceRecommendations.recommend(rows,summary,todayIso());if(!choices.length)return '<section class="risk-recommendations"><h2>Ways to address the gap</h2><p>No payment timing change around a planned income date resolves a negative day here. The lowest projected balance is '+money(summary.lowestBalance)+'; review income, funding, and payment amounts.</p></section>';return '<section class="risk-recommendations"><h2>Ways to address the gap</h2><p>Planning scenarios based on your calendar. Confirm any payment date or split with the biller before changing it.</p><div class="risk-options">'+choices.map(function(choice){return '<article class="risk-option"><div><strong>'+(choice.kind==='split'?'Split ':'Move ')+esc(choice.name)+'</strong><p>'+(choice.kind==='split'?'Move '+money(choice.amount)+' of '+money(choice.originalAmount):'Move '+money(choice.amount))+' from '+shortDate(choice.from)+' to '+shortDate(choice.to)+'</p><span>'+choice.daysResolved+' negative day'+(choice.daysResolved===1?'':'s')+' resolved · '+choice.negativeDaysAfter+' remain · Lowest '+money(choice.lowestAfter)+'</span></div><button type="button" class="risk-find-payment" data-date="'+choice.from+'" data-name="'+esc(choice.name)+'">View payment</button></article>'}).join('')+'</div></section>'}
function bindRecommendations(){mount.addEventListener('click',function(event){var button=event.target.closest('.risk-find-payment');if(!button)return;var panel=Array.from(mount.querySelectorAll('.month-panel')).find(function(node){return node.dataset.year+'-'+String(node.dataset.month).padStart(2,'0')===button.dataset.date.slice(0,7)});if(!panel)return;setYearExpanded(Number(panel.dataset.year),true,false);showMonth(panel.id.replace(/^panel-/,''));var day=Array.from(panel.querySelectorAll('.calendar-day')).find(function(node){return node.dataset.date===button.dataset.date});if(!day)return;var week=day.closest('.calendar-week');if(week)window.BillsOSCalendarList.setExpanded(week,true,true);day.scrollIntoView({behavior:'smooth',block:'center'});var card=Array.from(day.querySelectorAll('.ev')).find(function(node){var label=node.querySelector('.billsosCardName,.nm');return label&&label.textContent===button.dataset.name});var edit=card&&card.querySelector('.billsosCardEditBtn');if(edit)edit.focus({preventScroll:true})})}
function panelHtml(monthDef,model,allRows,prevEnd){var key=monthDef[0],name=monthDef[1],month=monthDef[2],year=monthDef[3],id=shortIds[key],m=model.months[key],rows=applyCardEdits(allRows,month,year),monthBegin=Number(prevEnd==null?(m&&m.begin||0):prevEnd),summary=window.BillsOSCalendarList.buildMonth(rows,year,month,monthBegin,{warning:LOW_BALANCE_WARNING,today:todayIso()}),income=rows.filter(function(r){return r.amount>0}).reduce(function(s,r){return s+r.amount},0),out=rows.filter(function(r){return r.amount<0}).reduce(function(s,r){return s+Math.abs(r.amount)},0),weeks=summary.weeks.map(weekHtml).join('');
return {html:'<section class="month-panel" id="panel-'+id+'" data-year="'+year+'" data-month="'+month+'" data-month-ending="'+summary.ending+'"><header><div><div class="eyebrow">BillsOS</div><h1>'+name+' <span>'+year+'</span></h1></div><div class="chips"><div class="chip"><span class="k">Starting</span><span class="v in">'+money(monthBegin)+'</span></div><div class="chip"><span class="k">Income</span><span class="v in">'+money(income)+'</span></div><div class="chip"><span class="k">Outflow</span><span class="v out">'+money(out)+'</span></div><div class="chip"><span class="k">Ending</span><span class="v">'+money(summary.ending)+'</span></div></div></header>'+riskHtml(summary)+recommendationsHtml(rows,summary)+'<div class="calendar-dow" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="calendar-list">'+weeks+'</div></section>',end:summary.ending,summary:summary,rows:rows}}
function showMonth(id){months.forEach(function(m){var short=shortIds[m[0]],panel=document.getElementById('panel-'+short),btn=document.getElementById('btn-'+short);if(panel)panel.classList.toggle('show',short===id);if(btn)btn.classList.toggle('active',short===id)});try{localStorage.setItem('bills-last-view-live',id)}catch(e){}}
function startMonth(){try{var saved=localStorage.getItem('bills-last-view-live'),savedMonth=months.find(function(m){return shortIds[m[0]]===saved});if(savedMonth&&(readPastMonths()||!isPastMonth(savedMonth)))return saved}catch(e){}return currentMonthId()}
function csvCell(v){var s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function activeMonthDef(){var panel=document.querySelector('.month-panel.show');if(!panel)return null;var year=Number(panel.getAttribute('data-year')),month=Number(panel.getAttribute('data-month'));return months.find(function(m){return m[2]===month&&m[3]===year})||null}
function exportMonthOptions(){return months.map(function(m){return '<option value="'+m[3]+'-'+String(m[2]).padStart(2,'0')+'">'+m[1]+' '+m[3]+'</option>'}).join('')}
function exportTransactions(model){var active=activeMonthDef();if(!active)return;var startValue=active[3]+'-'+String(active[2]).padStart(2,'0'),dialog=document.createElement('dialog');dialog.style.cssText='border:1px solid var(--line);border-radius:18px;padding:0;max-width:420px;width:calc(100% - 32px);color:var(--ink);background:var(--card);box-shadow:0 24px 70px rgba(55,43,31,.22)';dialog.innerHTML='<form method="dialog" style="padding:18px;display:grid;gap:14px"><div><b style="font-size:18px">Export transactions</b><div style="margin-top:4px;color:var(--mut);font-size:13px">Choose the first and last month to include.</div></div><label style="display:grid;gap:5px;font-weight:800">From<select id="exportFrom" style="font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card)">'+exportMonthOptions()+'</select></label><label style="display:grid;gap:5px;font-weight:800">Through<select id="exportThrough" style="font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card)">'+exportMonthOptions()+'</select></label><div id="exportError" style="display:none;color:var(--out);font-size:13px">End month must be the same as or after the start month.</div><div style="display:flex;justify-content:flex-end;gap:8px"><button value="cancel" class="export-btn">Cancel</button><button id="exportDownload" value="default" class="export-btn" style="background:var(--primary);color:#fff;border-color:var(--primary)">Export CSV</button></div></form>';document.body.appendChild(dialog);var from=dialog.querySelector('#exportFrom'),through=dialog.querySelector('#exportThrough'),error=dialog.querySelector('#exportError');from.value=startValue;through.value=startValue;dialog.querySelector('#exportDownload').onclick=function(e){e.preventDefault();var a=from.value,b=through.value;if(!a||!b||a>b){error.style.display='block';return}var all=allModelRows(model),lines=[['Date','Transaction','Type','Amount']];months.filter(function(m){var k=m[3]+'-'+String(m[2]).padStart(2,'0');return k>=a&&k<=b}).forEach(function(m){applyCardEdits(all,m[2],m[3]).forEach(function(r){lines.push([r.iso||r.date||'',r.name||'',r.type||'',Number(r.amount||0).toFixed(2)])})});var csv=lines.map(function(line){return line.map(csvCell).join(',')}).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='BillsOS-'+a+'-to-'+b+'-transactions.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url)},0);dialog.close()};dialog.addEventListener('close',function(){dialog.remove()},{once:true});dialog.showModal()}
function bindExport(model){var button=document.getElementById('exportTransactions');if(button)button.onclick=function(){exportTransactions(model)}}
function aheadHtml(choices,days){var future=days.filter(function(day){return day.date>=todayIso()}).slice(0,120).filter(function(day){return day.isNegative});if(!future.length)return '';if(!choices.length)return '<section class="risk-recommendations risk-ahead"><h2>Plan ahead</h2><p>No mortgage or Jeep split within the payment cutoffs resolves a projected negative day in the next 120 days. Review the first risk on '+shortDate(future[0].date)+'.</p></section>';return '<section class="risk-recommendations risk-ahead"><h2>Plan ahead</h2><p>These mortgage and Jeep splits can reduce future negative days. The full mortgage must be paid by the 17th and Jeep by the 25th. Confirm the split with the biller before changing your plan.</p><div class="risk-options">'+choices.map(function(choice){return '<article class="risk-option"><div><strong>'+esc(choice.name)+' · '+new Date(choice.from+'T12:00:00').toLocaleDateString(undefined,{month:'long'})+'</strong><p>'+money(choice.firstAmount)+' on '+shortDate(choice.firstDate)+' and '+money(choice.secondAmount)+' on '+shortDate(choice.secondDate)+'</p><span>'+choice.daysResolved+' upcoming negative day'+(choice.daysResolved===1?'':'s')+' resolved · '+choice.negativeDaysAfter+' remain over the next 120 days</span></div><button type="button" class="risk-find-payment" data-date="'+choice.from+'" data-name="'+esc(choice.name)+'">View payment</button></article>'}).join('')+'</div></section>'}
function panelsHtml(model){var allRows=allModelRows(model),prevEnd=null,parts=[],builtMonths=[];months.forEach(function(m){var built=panelHtml(m,model,allRows,prevEnd);parts.push(built.html);builtMonths.push(built);prevEnd=built.end});if(window.BillsOSNegativeBalanceRecommendations){var days=builtMonths.flatMap(function(item){return item.summary.days}),rows=builtMonths.flatMap(function(item){return item.rows}),choices=window.BillsOSNegativeBalanceRecommendations.recommendAhead(rows,days,todayIso(),120),current=todayIso().slice(0,7),index=months.findIndex(function(m){return m[3]+'-'+String(m[2]).padStart(2,'0')===current});if(index>=0){parts[index]=parts[index].replace('<div class="calendar-list">',aheadHtml(choices,days)+'<div class="calendar-list">')}}return parts.join('\n')}
async function load(){try{var engine=await waitForEngine(),data=await loadBillsData(),model=engine.build(data,{floorNegative:false}),initialMonth=startMonth();tabs.classList.add('year-nav');tabs.innerHTML=yearTabsHtml(initialMonth);bindYearTabs();bindPastMonthsToggle();mount.innerHTML=panelsHtml(model);window.BillsOSCalendarList.bind(mount);window.BillsOSCalendarList.bindView(mount);bindMonthTabs();bindExport(model);bindRecommendations();if(!data.bills.length&&!data.income.length&&!data.oneTimeEvents.length){mount.insertAdjacentHTML('afterbegin','<div class="empty"><b>No Control Center data found.</b><br>Add bills, income, or one-time items in Control Center, then return here.</div>')}showMonth(initialMonth);window.BillsOSLive={loaded:true,source:'api-bills',bills:data.bills.length,income:data.income.length,oneTimeEvents:data.oneTimeEvents.length,engine:engine.BUILD,version:VERSION}}catch(e){mount.innerHTML='<div class="loader error"><b>Calendar failed to load.</b><br>'+esc(e.message||e)+'</div>'}}
load();
})();
