<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BillsOS</title>
<style>
:root{--ink:#17212b;--mut:#6d645b;--line:#ded6ca;--primary:#1f3a3d;--green:#2f7d5c;--out:#b65b45;--card:#fffdf8;--bg:#f3f0ea}*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top left,#fbf7ef 0,var(--bg) 48%,#e9e2d8 100%);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1280px;margin:0 auto}.pill{display:inline-block;margin:0 0 14px;background:rgba(255,253,248,.85);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;color:var(--mut);font-weight:800}.hero,.card,.month-panel{background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 60px rgba(55,43,31,.10)}.hero{display:flex;justify-content:space-between;gap:14px;padding:18px;margin-bottom:12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--mut);font-weight:900}.hero h1{font-size:clamp(34px,5vw,58px);line-height:.9;letter-spacing:-.05em;margin:4px 0 7px}.sub{color:var(--mut)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{border:1px solid var(--line);border-radius:13px;padding:9px 12px;text-decoration:none;color:var(--ink);font-weight:800;background:var(--card)}.nav a:first-child{background:var(--primary);border-color:var(--primary);color:white}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 12px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;font-weight:900;color:var(--mut)}.tabs button.active{background:var(--primary);color:#fff}.month-panel{display:none;padding:16px}.month-panel.show{display:block}.month-panel header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.month-panel h1{font-size:34px;margin:0}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{background:#fbf7ef;border:1px solid rgba(222,214,202,.86);border-radius:16px;padding:10px 11px;min-width:120px}.chip .k{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:900}.chip .v{display:block;margin-top:4px;font-size:18px;font-weight:900}.chip .in{color:var(--green)}.chip .out{color:var(--out)}.chip .gold{color:#8a5e12}.ops-panel,.status-grid,.plan-card,.spark,.legend{display:none!important}.dow-row,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.dow-row span{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--mut)}.grid{margin-top:8px}.day{min-height:142px;border:1px solid rgba(222,214,202,.84);border-radius:16px;background:var(--card);padding:8px;display:flex;flex-direction:column}.day.is-blank,.day.is-past{border:0;background:transparent}.dtop,.bod,.eod{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut)}.dnum{font-size:18px;font-weight:900;color:var(--ink)}.badge{border-radius:999px;background:#eef2f7;padding:3px 7px;font-size:9px;font-weight:900}.events{display:grid;gap:5px;flex:1;margin:6px 0}.ev{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;border-radius:10px;padding:5px 6px;font-size:12px;line-height:1.15;background:#eef2f7;color:#263445}.ev.in{background:#e7f2ea;color:var(--green)}.ev.out{background:#f7e7e0;color:var(--out)}.ev.xfer{background:#f6edd8;color:#8a5e12}.ev.note{background:#eef2f7;color:var(--mut)}.ev.done{opacity:.52;text-decoration:line-through}.ev input{width:14px;height:14px;margin:0}.amt{font-weight:900;white-space:nowrap}.loader{padding:18px;border:1px solid var(--line);background:var(--card);border-radius:18px}.error{color:#b65b45}@media(max-width:900px){body{padding:10px}.hero{display:block}.nav{margin-top:12px}.chips{justify-content:flex-start}.dow-row{display:none}.grid{display:block}.day{min-height:auto;margin:8px 0}.day.is-blank,.day.is-past{display:none}.month-panel header{display:block}.chip{min-width:0}.chips{margin-top:10px}.month-panel{padding:13px}}
</style>
</head>
<body>
<div class="wrap">
<div class="pill">LIVE BUILD · 2026-07-07 · static month source</div>
<section class="hero"><div><div class="eyebrow">BillsOS</div><h1>Bills Dashboard</h1><div class="sub">Live view now loads the corrected month files directly. August opens from July 31 ending balance.</div></div><div class="nav"><a href="/">Live Dashboard</a><a href="/control">Control Center</a><a href="/legacy">Legacy</a></div></section>
<div class="tabs" id="tabs"></div>
<div id="mount"><div class="loader">Loading calendar…</div></div>
</div>
<script>
(function(){
'use strict';
var VERSION='20260707staticmonths1';
var months=[['june','June'],['july','July'],['aug','August'],['sep','September'],['oct','October'],['nov','November'],['dec','December']];
var mount=document.getElementById('mount'),tabs=document.getElementById('tabs');
function clean(v){return String(v||'').replace(/\s+/g,' ').trim();}
function eventId(ev){var day=ev.closest('.day'),panel=ev.closest('.month-panel');return (panel&&panel.id?panel.id.replace('panel-',''):'month')+'|'+(day?day.getAttribute('data-day'):'x')+'|'+clean((ev.querySelector('.nm')||{}).textContent)+'|'+clean((ev.querySelector('.amt')||{}).textContent);}
function readDone(){try{return JSON.parse(localStorage.getItem('billsos-completed-events-v1')||'{}')||{};}catch(e){return {};}}
function writeDone(done){try{localStorage.setItem('billsos-completed-events-v1',JSON.stringify(done||{}));}catch(e){}}
function applyChecks(){var done=readDone();document.querySelectorAll('.month-panel .ev').forEach(function(ev){if(ev.classList.contains('in')||ev.classList.contains('note'))return;if(!ev.querySelector('input[type="checkbox"]')){var cb=document.createElement('input');cb.type='checkbox';cb.setAttribute('aria-label','Mark complete');ev.insertBefore(cb,ev.firstChild);}var box=ev.querySelector('input[type="checkbox"]'),id=eventId(ev);box.checked=!!done[id];ev.classList.toggle('done',box.checked);box.onchange=function(){var next=readDone();if(box.checked)next[id]=1;else delete next[id];writeDone(next);ev.classList.toggle('done',box.checked);try{fetch('/api/checkmarks',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:next})});}catch(e){}};});}
function showMonth(id){months.forEach(function(m){var panel=document.getElementById('panel-'+m[0]),btn=document.getElementById('btn-'+m[0]);if(panel){panel.classList.toggle('show',m[0]===id);panel.style.display=m[0]===id?'block':'none';}if(btn)btn.classList.toggle('active',m[0]===id);});try{localStorage.setItem('bills-last-view-static',id);}catch(e){}}
function startMonth(){try{var saved=localStorage.getItem('bills-last-view-static');if(saved&&months.some(function(m){return m[0]===saved;}))return saved;}catch(e){}var idx=new Date().getMonth();return months[idx-5]&&months[idx-5][0]||'july';}
async function load(){try{tabs.innerHTML=months.map(function(m){return '<button id="btn-'+m[0]+'" type="button">'+m[1]+'</button>';}).join('');var html=[];for(var i=0;i<months.length;i++){var r=await fetch('/months/'+months[i][0]+'.html?v='+VERSION,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw new Error(months[i][1]+' returned HTTP '+r.status);html.push(await r.text());}mount.innerHTML=html.join('\n');months.forEach(function(m){var btn=document.getElementById('btn-'+m[0]);if(btn)btn.onclick=function(){showMonth(m[0]);};});applyChecks();showMonth(startMonth());window.BillsOSLiveStatic={loaded:true,version:VERSION,augOpening:clean((document.querySelector('#panel-aug .chip .v')||{}).textContent||'')};}catch(e){mount.innerHTML='<div class="loader error"><b>Calendar failed to load.</b><br>'+String(e.message||e)+'</div>';}}
load();
})();
</script>
</body>
</html>
