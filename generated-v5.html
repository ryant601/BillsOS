<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BillsOS</title>
<style>
:root{--ink:#17212b;--mut:#6d645b;--line:#ded6ca;--primary:#1f3a3d;--green:#2f7d5c;--out:#b65b45;--card:#fffdf8;--bg:#f3f0ea}*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top left,#fbf7ef 0,var(--bg) 48%,#e9e2d8 100%);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1280px;margin:0 auto}.pill{display:inline-block;margin:0 0 14px;background:rgba(255,253,248,.85);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;color:var(--mut);font-weight:800}.hero,.month-panel,.empty{background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 60px rgba(55,43,31,.10)}.hero{display:flex;justify-content:space-between;gap:14px;padding:18px;margin-bottom:12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--mut);font-weight:900}.hero h1{font-size:clamp(34px,5vw,58px);line-height:.9;letter-spacing:-.05em;margin:4px 0 7px}.sub{color:var(--mut)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{border:1px solid var(--line);border-radius:13px;padding:9px 12px;text-decoration:none;color:var(--ink);font-weight:800;background:var(--card)}.nav a:first-child{background:var(--primary);border-color:var(--primary);color:white}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 12px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;font-weight:900;color:var(--mut);cursor:pointer}.tabs button.active{background:var(--primary);color:#fff}.month-panel{display:none;padding:16px}.month-panel.show{display:block}.month-panel header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.month-panel h1{font-size:34px;margin:0}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{background:#fbf7ef;border:1px solid rgba(222,214,202,.86);border-radius:16px;padding:10px 11px;min-width:120px}.chip .k{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:900}.chip .v{display:block;margin-top:4px;font-size:18px;font-weight:900}.chip .in{color:var(--green)}.chip .out{color:var(--out)}.dow-row,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.dow-row span{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--mut)}.grid{margin-top:8px}.day{height:172px;min-height:172px;border:1px solid rgba(222,214,202,.84);border-radius:16px;background:var(--card);padding:8px;display:flex;flex-direction:column;overflow:hidden}.day.is-blank{border:0;background:transparent}.day.is-warn{border-color:rgba(182,91,69,.35)}.day.is-today{outline:2px solid rgba(31,58,61,.28)}.dtop,.bod,.eod{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut);flex:0 0 auto}.dnum{font-size:18px;font-weight:900;color:var(--ink)}.badge{border-radius:999px;background:#eef2f7;padding:3px 7px;font-size:9px;font-weight:900}.events{display:flex;flex-direction:column;gap:5px;flex:1 1 auto;min-height:0;margin:6px 0;overflow-y:auto;overscroll-behavior:contain;padding-right:3px;scrollbar-width:thin}.events::-webkit-scrollbar{width:5px}.events::-webkit-scrollbar-thumb{background:rgba(31,58,61,.22);border-radius:999px}.ev{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;flex:0 0 auto;border-radius:10px;padding:5px 6px;font-size:12px;line-height:1.15;background:#eef2f7;color:#263445}.ev.in{background:#e7f2ea;color:var(--green)}.ev.out{background:#f7e7e0;color:var(--out)}.ev.xfer{background:#f6edd8;color:#8a5e12}.amt{font-weight:900;white-space:nowrap}.loader,.empty{padding:18px}.error{color:#b65b45}@media(max-width:900px){body{padding:10px}.hero{display:block}.nav{margin-top:12px}.chips{justify-content:flex-start}.dow-row{display:none}.grid{display:block}.day{height:190px;min-height:190px;margin:8px 0}.day.is-blank{display:none}.month-panel header{display:block}.month-panel{padding:13px}}
</style>
</head>
<body>
<div class="wrap">
<div class="pill">LIVE BUILD · 2026-07-07 · Control Center source</div>
<section class="hero"><div><div class="eyebrow">BillsOS</div><h1>Bills Dashboard</h1><div class="sub">This view renders from Control Center data. No hidden paychecks, action logs, or system rule rows are used.</div></div><div class="nav"><a href="/">Live Dashboard</a><a href="/control">Control Center</a><a href="/legacy">Legacy</a></div></section>
<div class="tabs" id="tabs"></div><div id="mount"><div class="loader">Loading calendar…</div></div>
</div>
<script id="billsosCashflowEngine" defer src="/cashflow-engine.js?v=20260707nohiddenrules1"></script>
<script>
(function(){'use strict';
var VERSION='20260707controlsource1';
var months=[['june','June',6],['july','July',7],['august','August',8],['september','September',9],['october','October',10],['november','November',11],['december','December',12]];
var shortIds={june:'june',july:'july',august:'aug',september:'sep',october:'oct',november:'nov',december:'dec'};
var mount=document.getElementById('mount'),tabs=document.getElementById('tabs');
function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function signed(v){return (v>=0?'+':'−')+Number(Math.abs(v)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function days(month){return new Date(2026,month,0).getDate()}
function iso(month,day){return '2026-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0')}
function todayIso(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function waitForEngine(){return new Promise(function(resolve,reject){var tries=0;(function tick(){if(window.BillsOSCashflow)return resolve(window.BillsOSCashflow);if(++tries>80)return reject(new Error('Cashflow engine did not load.'));setTimeout(tick,50)})()})}
async function loadBillsData(){var data={bills:[],income:[],oneTimeEvents:[]};try{var r=await fetch('/api/bills?dashboard='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(r.ok)data=await r.json()}catch(e){}data.bills=Array.isArray(data.bills)?data.bills.filter(function(x){return x&&x.active!==false}):[];data.income=Array.isArray(data.income)?data.income.filter(function(x){return x&&x.active!==false&&Number(x.amount||0)}):[];data.oneTimeEvents=Array.isArray(data.oneTimeEvents)?data.oneTimeEvents.filter(function(x){return x&&!/^__billsos_/.test(String(x.id||''))&&Number(x.amount||0)}):[];return data}
function eventsByDay(rows){var out={};rows.forEach(function(r){(out[r.day]=out[r.day]||[]).push(r)});return out}
function panelHtml(monthDef,model){var key=monthDef[0],name=monthDef[1],month=monthDef[2],id=shortIds[key],m=model.months[key],rows=m&&m.rows||[],byDay=eventsByDay(rows),dim=days(month),firstDow=new Date(2026,month-1,1).getDay(),html='';for(var b=0;b<firstDow;b++)html+='<div class="day is-blank"></div>';var run=Number(m&&m.begin||0),today=todayIso();for(var d=1;d<=dim;d++){var before=run,items=byDay[d]||[];items.forEach(function(r){run+=Number(r.amount||0)});var date=iso(month,d),warn=run<1000?' is-warn':'',isToday=date===today?' is-today':'',evs=items.map(function(r){var cls=r.amount>0?'in':(/transfer|sweep|fund|spending/i.test(r.name)||r.type==='transfer'?'xfer':'out'),cardKey=r.iso+'|'+r.name+'|'+r.amount;return '<div class="ev '+cls+'" data-id="'+esc(cardKey)+'"><span class="dot"></span><span class="nm">'+esc(r.name)+'</span><span class="amt">'+signed(r.amount)+'</span></div>'}).join('');html+='<div class="day'+warn+isToday+'" data-day="'+d+'"><div class="dtop"><span class="dnum">'+d+'</span><span>'+new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})+'</span>'+(isToday?'<span class="badge">Today</span>':'')+'</div><div class="bod"><span>begin day</span><b>'+money(before)+'</b></div><div class="events">'+evs+'</div><div class="eod"><span>end of day</span><b>'+money(run)+'</b></div></div>'}
var income=rows.filter(function(r){return r.amount>0}).reduce(function(s,r){return s+r.amount},0),out=rows.filter(function(r){return r.amount<0}).reduce(function(s,r){return s+Math.abs(r.amount)},0);
return '<section class="month-panel" id="panel-'+id+'"><header><div><div class="eyebrow">BillsOS</div><h1>'+name+' <span>2026</span></h1></div><div class="chips"><div class="chip"><span class="k">Starting</span><span class="v in">'+money(m&&m.begin)+'</span></div><div class="chip"><span class="k">Income</span><span class="v in">'+money(income)+'</span></div><div class="chip"><span class="k">Outflow</span><span class="v out">'+money(out)+'</span></div><div class="chip"><span class="k">Ending</span><span class="v">'+money(m&&m.end)+'</span></div></div></header><div class="dow-row"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="grid">'+html+'</div></section>'}
function showMonth(id){months.forEach(function(m){var short=shortIds[m[0]],panel=document.getElementById('panel-'+short),btn=document.getElementById('btn-'+short);if(panel)panel.classList.toggle('show',short===id);if(btn)btn.classList.toggle('active',short===id)});try{localStorage.setItem('bills-last-view-live',id)}catch(e){}}
function startMonth(){try{var saved=localStorage.getItem('bills-last-view-live');if(saved&&months.some(function(m){return shortIds[m[0]]===saved}))return saved}catch(e){}var idx=new Date().getMonth()+1,found=months.find(function(m){return m[2]===idx});return found?shortIds[found[0]]:'july'}
async function load(){try{var engine=await waitForEngine(),data=await loadBillsData(),model=engine.build(data,{floorNegative:false});tabs.innerHTML=months.map(function(m){var id=shortIds[m[0]];return '<button id="btn-'+id+'" type="button">'+m[1]+'</button>'}).join('');mount.innerHTML=months.map(function(m){return panelHtml(m,model)}).join('\n');months.forEach(function(m){var id=shortIds[m[0]],btn=document.getElementById('btn-'+id);if(btn)btn.onclick=function(){showMonth(id)}});if(!data.bills.length&&!data.income.length&&!data.oneTimeEvents.length){mount.insertAdjacentHTML('afterbegin','<div class="empty"><b>No Control Center data found.</b><br>Add bills, income, or one-time items in Control Center, then return here.</div>')}showMonth(startMonth());window.BillsOSLive={loaded:true,source:'api-bills',bills:data.bills.length,income:data.income.length,oneTimeEvents:data.oneTimeEvents.length,engine:engine.BUILD,version:VERSION}}catch(e){mount.innerHTML='<div class="loader error"><b>Calendar failed to load.</b><br>'+esc(e.message||e)+'</div>'}}
load();
})();
</script>
<script id="billsosCardEditor" defer src="/billsos-card-editor.js?v=20260707cardcompact1"></script>
</body>
</html>
