<style>

  .card{background:#fff;border:1px solid rgba(20,35,55,.14);border-radius:22px;box-shadow:0 16px 40px rgba(20,35,55,.08);padding:22px;max-width:520px;width:100%}
  h1{font-size:28px;margin:0 0 8px;letter-spacing:-.03em}
  p{font-size:15px;line-height:1.45;color:#536170;margin:0 0 14px}

<body>
  <main class="card">
    <h1>BillsOS latest</h1>
    <p>This entry point bypasses the cached app shell and opens the current dashboard build.</p>
    <p>Current build includes <b>Travelers Insurance</b> on July 1 for <b>$521</b>.</p>
    <a id="openLatest" href="/?v=20260627-travelers-direct">Open latest dashboard</a>
    <p style="margin-top:14px;font-size:13px">If Safari still shows old labels, close the tab and reopen <code>/latest.html</code>.</p>
  </main>
<script>
(function(){
  var stamp='20260627-travelers-direct-'+Date.now();
  var target='/?v='+encodeURIComponent(stamp);
  var a=document.getElementById('openLatest');
  if(a)a.href=target;
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();});}).catch(function(){});}
  if(window.caches&&caches.keys){caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k);});}).catch(function(){});}
})();
</script>
